{% set version = "3.11.0" %}

package:
  name: paste
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/P/Paste/paste-{{ version }}.tar.gz
  sha256: c8e95401cbeb80c34bf832a5cd517fbaec7499225b334b2b24ba539a7f54e3ae

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - setuptools
    - six >=1.4.0

test:
  imports:
    - paste
    - paste.auth
    - paste.cowbell
    - paste.debug
    - paste.evalexception
    - paste.exceptions
    - paste.util
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pythonpaste.readthedocs.io/
  summary: Tools for using a Web Server Gateway Interface stack
  license: MIT
  license_file: docs/license.txt

extra:
  recipe-maintainers:
    - kwilcox
    - daf
